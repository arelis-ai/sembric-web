# Static file server for the prerendered site. Security headers come from the generated snippet
# (scripts/render-nginx.mjs); nginx does not inherit add_header into a location that sets its own, so every
# location includes it. Cache policy matches cacheControl() in scripts/headers.mjs.
# Agents that ask for Markdown (Accept: text/markdown, as Claude Code does) get the page's Markdown copy at the same URL.
map $http_accept $markdown_ext {
  default "";
  "~*text/markdown" ".md";
}
map $http_accept $root_document {
  default "/index.html";
  "~*text/markdown" "/index.md";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  absolute_redirect off;
  etag on;
  charset utf-8;
  charset_types text/css text/plain text/markdown text/xml application/javascript application/json image/svg+xml application/manifest+json;

  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/markdown text/xml application/xml application/javascript application/json image/svg+xml application/manifest+json;

  # A types block replaces the inherited map, so include the standard types alongside the two nginx lacks.
  include /etc/nginx/mime.types;
  types {
    text/markdown md;
    application/manifest+json webmanifest;
  }

  error_page 404 /404.html;

  # Never serve dotfiles (such as build metadata), except /.well-known/.
  location ~ /\.(?!well-known/) {
    return 404;
  }

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~ ^/(og/|icon-|apple-touch-icon|favicon) {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # One canonical URL per page: drop a trailing slash (except on the root).
  location ~ ^(.+)/$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 301 $1;
  }

  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Vary "Accept" always;
    try_files $root_document =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Vary "Accept" always;
    try_files $uri$markdown_ext $uri $uri/index.html =404;
  }
}
