# Pull-request and main-branch gate. Branch protection requires both jobs; deploy.yml repeats the check before shipping.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint, format, typecheck, build, unit/SEO/CSP/content tests, link check and dependency audit.
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (local server with production headers)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-check
          path: playwright-report/
          retention-days: 7

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: sembric-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (fails on fixable HIGH or CRITICAL)
        run: bash scripts/image-scan.sh sembric-web:ci
      - name: Start container
        run: |
          docker run -d --name site -p 127.0.0.1:8080:8080 sembric-web:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8080/ | grep -i '^content-security-policy:'
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests against nginx
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - name: Lighthouse CI (mobile; performance ≥ 0.95, other categories 1.0)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-and-playwright
          path: |
            .lighthouseci/
            playwright-report/
          retention-days: 14
